<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="1200" height="320" role="img" aria-label="Sugar Scan banner" xmlns:c2pa="http://c2pa.org/manifest">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f2027"/>
      <stop offset="50%" stop-color="#14424f"/>
      <stop offset="100%" stop-color="#1e6f7c"/>
    </linearGradient>
    <linearGradient id="line" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#38f9d7" stop-opacity="0"/>
      <stop offset="40%" stop-color="#38f9d7"/>
      <stop offset="100%" stop-color="#43e97b"/>
    </linearGradient>
    <linearGradient id="title" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#a8ffec"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-50%" width="140%" height="200%">
      <feGaussianBlur stdDeviation="4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <style>
      .ecg { stroke-dasharray: 1700; stroke-dashoffset: 1700; animation: draw 4s ease-in-out infinite; }
      @keyframes draw { 0% { stroke-dashoffset: 1700; } 60% { stroke-dashoffset: 0; } 100% { stroke-dashoffset: -1700; } }
      .pulse { animation: pulse 2s ease-in-out infinite; transform-origin: 1080px 74px; }
      @keyframes pulse { 0%,100% { opacity: .35; } 50% { opacity: 1; } }
    </style>
  </defs>

  <rect width="1200" height="320" rx="24" fill="url(#bg)"/>

  <!-- soft decorative circles -->
  <circle cx="1100" cy="40" r="140" fill="#ffffff" opacity="0.04"/>
  <circle cx="90" cy="300" r="120" fill="#ffffff" opacity="0.04"/>
  <circle cx="1080" cy="74" r="6" fill="#43e97b" class="pulse"/>

  <!-- ECG heartbeat line -->
  <path class="ecg" filter="url(#glow)" fill="none" stroke="url(#line)" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"
        d="M0 250 L200 250 L250 250 L280 205 L310 290 L345 160 L380 270 L410 250 L620 250 L670 250 L700 215 L730 285 L765 175 L800 265 L830 250 L1200 250"/>

  <!-- title -->
  <text x="600" y="125" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="78" font-weight="800" fill="url(#title)" letter-spacing="2">Sugar Scan</text>
  <text x="600" y="170" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="24" fill="#d6fff6" opacity="0.92">Machine Learning-Powered Diabetes Risk Prediction</text>

  <!-- pill -->
  <rect x="440" y="192" width="320" height="34" rx="17" fill="#ffffff" opacity="0.12"/>
  <text x="600" y="215" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="16" fill="#ffffff" letter-spacing="1.5">RUNS 100% IN YOUR BROWSER</text>

  <text x="600" y="300" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" fill="#ffffff" opacity="0.7" letter-spacing="3">BY PASINDU HARSHA  •  CIRCUITWAVE LABS</text>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
